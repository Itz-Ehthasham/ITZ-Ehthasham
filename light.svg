      <rect x="84" y="98" width="372" height="398" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.05"/>
      <text x="120" y="149" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="14" letter-spacing="2.5">TERMINAL / PORTRAIT</text>
      <g transform="translate(0 0)">
