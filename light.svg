        <g transform="translate(0 0)">
          <rect x="0" y="0" width="66" height="30" rx="15" fill="#f8fafc" fill-opacity="0.82" stroke="#06b6d4" stroke-opacity="0.3"/>
          <text x="16" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">Python</text>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4.2s" repeatCount="indefinite"/>
        </g>
