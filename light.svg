      <rect x="580" y="320" width="58" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
      <text x="594" y="335" fill="#0f766e" font-family="Segoe UI, Inter, Arial" font-size="12">typing</text>

      <g opacity="0" transform="translate(0 0)">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/>
        <text x="580" y="378" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="15">Location</text>
        <text x="730" y="378" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="15">Hyderabad, India</text>
        <text x="580" y="410" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="15">Education</text>
        <text x="730" y="410" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="15">BS Software Engineering</text>
        <text x="580" y="442" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="15">Current Focus</text>
        <text x="730" y="442" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="15">Full-stack products &amp; AI</text>
        <text x="580" y="474" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="15">Portfolio</text>
        <text x="730" y="474" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="15">ehthasham.vercel.app</text>
        <text x="580" y="506" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="15">Email</text>
        <text x="730" y="506" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="15">ehthashama678@gmail.com</text>
      </g>

      <text x="580" y="548" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="16" font-weight="600">Skills</text>
      <g transform="translate(580 560)">
        <g transform="translate(0 0)">
          <rect x="0" y="0" width="74" height="30" rx="15" fill="#f8fafc" fill-opacity="0.82" stroke="#2563eb" stroke-opacity="0.3"/>
          <text x="18" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">React</text>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(84 0)">
          <rect x="0" y="0" width="84" height="30" rx="15" fill="#f8fafc" fill-opacity="0.82" stroke="#2563eb" stroke-opacity="0.3"/>
          <text x="18" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">Next.js</text>
          <animateTransform attributeName="transform" type="translate" values="84 0;82 -2;84 0" dur="4.4s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(182 0)">
          <rect x="0" y="0" width="72" height="30" rx="15" fill="#f8fafc" fill-opacity="0.82" stroke="#2563eb" stroke-opacity="0.3"/>
