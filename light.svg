          <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.5s" repeatCount="indefinite" additive="sum"/>
          <text x="112" y="204" fill="url(#asciiGradL)" font-family="Consolas, 'Cascadia Code', monospace" font-size="18" letter-spacing="1.2">
            <tspan x="112" dy="0">      .-.</tspan>
            <tspan x="112" dy="24">    .'   '.</tspan>
            <tspan x="112" dy="24">   /  .-.  \</tspan>
            <tspan x="112" dy="24">  |  (   )  |</tspan>
            <tspan x="112" dy="24">   \  `-'  /</tspan>
            <tspan x="112" dy="24">    '.___.' </tspan>
            <tspan x="112" dy="24">   /  /|\  \</tspan>
            <tspan x="112" dy="24">  /__/ | \__\</tspan>
            <tspan x="112" dy="24">      /_/</tspan>
          </text>
          <text x="112" y="432" fill="#2563eb" font-family="Consolas, 'Cascadia Code', monospace" font-size="16" opacity="0.9">// cyber interface</text>
          <text x="112" y="458" fill="#0f766e" font-family="Consolas, 'Cascadia Code', monospace" font-size="16" opacity="0.9">// stable / adaptive / curious</text>
        </g>
        <rect x="112" y="182" width="280" height="200" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1" rx="12"/>
      </g>
    </g>

    <g>
      <rect x="540" y="88" width="530" height="430" rx="24" fill="#ffffff" fill-opacity="0.76" stroke="#0f172a" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="560" y="108" width="490" height="390" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.05"/>
      <rect x="578" y="128" width="100" height="18" rx="9" fill="#f43f5e" fill-opacity="0.85"/>
