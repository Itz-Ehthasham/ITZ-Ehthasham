      <rect x="802" y="128" width="100" height="18" rx="9" fill="#10b981" fill-opacity="0.85"/>

      <text x="580" y="190" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="24" font-weight="600">Hi 👋</text>
      <text x="580" y="222" fill="#0f172a" font-family="Segoe UI, Inter, Arial" font-size="34" font-weight="700">I'm Ehthasham Mustafa</text>

      <text x="580" y="278" fill="#64748b" font-family="Segoe UI, Inter, Arial" font-size="17">Working as</text>
      <text x="580" y="306" fill="url(#accentGradL)" font-family="Consolas, 'Cascadia Code', monospace" font-size="22" font-weight="600">
