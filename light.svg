          <animateTransform attributeName="transform" type="translate" values="268 0;266 -2;268 0" dur="5.2s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(366 0)">
          <rect x="0" y="0" width="84" height="30" rx="15" fill="#f8fafc" fill-opacity="0.82" stroke="#2563eb" stroke-opacity="0.3"/>
          <text x="16" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">Tailwind</text>
          <animateTransform attributeName="transform" type="translate" values="366 0;364 -2;366 0" dur="5.6s" repeatCount="indefinite"/>
        </g>
      </g>

