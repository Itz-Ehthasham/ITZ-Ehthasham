          <text x="16" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">AWS</text>
          <animateTransform attributeName="transform" type="translate" values="258 0;256 -2;258 0" dur="5.4s" repeatCount="indefinite"/>
