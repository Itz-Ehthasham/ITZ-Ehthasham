          <text x="16" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">Postgres</text>
          <animateTransform attributeName="transform" type="translate" values="164 0;162 -2;164 0" dur="5s" repeatCount="indefinite"/>
        </g>
