          <text x="16" y="20" fill="#334155" font-family="Segoe UI, Inter, Arial" font-size="12">Docker</text>
          <animateTransform attributeName="transform" type="translate" values="80 0;78 -2;80 0" dur="4.6s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(164 0)">
